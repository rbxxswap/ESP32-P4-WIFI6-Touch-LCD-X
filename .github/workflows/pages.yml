name: Deploy web flasher (Pages)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ["ESP-IDF Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (blank = newest release incl. prereleases)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip needless runs: only deploy on successful builds, page edits, or manual dispatch
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (docs + manifest from main)
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          fi
          if [ -z "$TAG" ]; then
            echo "No release found - nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Publishing firmware from release: $TAG"
          fi

      - name: Stage site (docs + firmware + version stamp)
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r docs/. _site/
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'firmware-merged-esp32p4.bin' \
            --dir _site \
            --clobber
          tmp=$(mktemp)
          jq --arg v "$TAG" '.version=$v' _site/manifest.json > "$tmp"
          mv "$tmp" _site/manifest.json
          echo "---- _site contents ----"
          ls -la _site
          echo "---- manifest ----"
          cat _site/manifest.json

      - name: Upload Pages artifact
        if: steps.tag.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.tag.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
